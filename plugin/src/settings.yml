---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.0.3
serverless_language: node
refresh_interval_floor:
polling_url: https://science.nasa.gov/wp-json/wp/v2/posts?categories=2151&per_page=10&_embed=wp:featuredmedia&_fields=title,date_gmt,link,excerpt,_links,_embedded
polling_headers: ''
polling_body: ''
id: 280791
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: Displays the NASA Earth Observatory Image of the Day — satellite and scientific imagery of Earth with title, description, and author.<br />Data is pulled directly from the official NASA Science API (Earth Observatory category).
  category: nature,environment
  github_url: https://github.com/ExcuseMi/trmnl-earth-observatory-plugin
  learn_more_url: https://science.nasa.gov/earth/earth-observatory/image-of-the-day/
- keyname: mode
  field_type: select
  name: Image Selection
  default: latest
  options:
  - Latest - Most recent image of the day: latest
  - Random - Surprise me with a recent image: random
- keyname: show_qr_code
  field_type: boolean
  name: Show QR Code
  help_text: QR Code links to the full NASA article. Only shown on full view.
  default: 'false'
  optional: true
name: Earth Observatory Image of the Day
description:
refresh_interval: 360
